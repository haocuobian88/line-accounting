<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速記帳</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .form-label { font-weight: bold; }
        #loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 20px;}
        #form-content { display: none; }
    </style>
</head>
<body>

    <div id="loading">載入中...</div>

    <div id="form-content" class="container">
        <h4 class="mb-3 text-center">💸 記一筆</h4>
        <form id="accountForm">
            
            <div class="mb-3">
                <label class="form-label">日期</label>
                <input type="date" class="form-control" id="date" required>
            </div>

            <div class="mb-3">
                <label class="form-label">誰的帳</label>
                <select class="form-select" id="who">
                    <option value="我" selected>我</option>
                    <option value="家人">家人</option>
                    <option value="公帳">公帳</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">消費分類</label>
                <select class="form-select" id="category" required>
                    <option value="" disabled selected>請選擇...</option>
                    <option value="餐飲">餐飲 🍱</option>
                    <option value="交通">交通 🚗</option>
                    <option value="購物">購物 🛍️</option>
                    <option value="居家">居家 🏠</option>
                    <option value="娛樂">娛樂 🎮</option>
                    <option value="醫療">醫療 💊</option>
                    <option value="投資">投資 📈</option>
                    <option value="其他">其他 🔧</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">消費內容</label>
                <input type="text" class="form-control" id="item" placeholder="例如：午餐、加油" required>
            </div>

            <div class="mb-3">
                <label class="form-label">金額</label>
                <input type="number" class="form-control" id="amount" placeholder="0" inputmode="numeric" required>
            </div>

            <div class="mb-3">
                <label class="form-label">支付方式</label>
                <select class="form-select" id="payment" onchange="toggleCardInput()" required>
                    <option value="現金" selected>現金 💵</option>
                    <option value="信用卡">信用卡 💳</option>
                    <option value="銀行帳戶">銀行帳戶 🏦</option>
                    <option value="銀行貸款">銀行貸款 💸</option>
                </select>
            </div>

            <div class="mb-3" id="cardInfoGroup" style="display:none;">
                <label class="form-label">卡片/銀行名稱</label>
                <input type="text" class="form-control" id="cardInfo" placeholder="例如：Cube卡、中信">
            </div>

            <div class="mb-3">
                <label class="form-label">備註</label>
                <input type="text" class="form-control" id="note" placeholder="選填">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">送出記帳</button>
            </div>
        </form>
    </div>

    <script>
        // 設定預設日期為今天
        document.getElementById('date').valueAsDate = new Date();

        // 1. 初始化 LIFF
        // ⚠️ 請將下方的 'YOUR_LIFF_ID' 換成您在 LINE Developers 申請到的 ID
        const LIFF_ID = 'YOUR_LIFF_ID';

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('form-content').style.display = 'block';
                }
            } catch (err) {
                alert("LIFF 初始化失敗: " + err);
            }
        }
        main();

        // 2. 切換支付方式時的顯示邏輯
        function toggleCardInput() {
            const payment = document.getElementById('payment').value;
            const cardGroup = document.getElementById('cardInfoGroup');
            if (payment === '信用卡' || payment === '銀行帳戶' || payment === '銀行貸款') {
                cardGroup.style.display = 'block';
            } else {
                cardGroup.style.display = 'none';
                document.getElementById('cardInfo').value = ''; // 清空
            }
        }

        // 3. 送出表單
        document.getElementById('accountForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!liff.isInClient()) {
                alert('請在 LINE App 中開啟此頁面');
                return;
            }

            // 收集資料
            const data = {
                date: document.getElementById('date').value.replace(/-/g, '/'), // 轉成 YYYY/MM/DD
                who: document.getElementById('who').value,
                category: document.getElementById('category').value,
                content: document.getElementById('item').value,
                amount: document.getElementById('amount').value,
                payment: document.getElementById('payment').value,
                cardInfo: document.getElementById('cardInfo').value,
                note: document.getElementById('note').value
            };

            // 轉成 JSON 字串，並加上特殊前綴 #LIFF_DATA
            // 這樣 n8n 就可以識別這是來自表單的資料，而不是普通聊天
            const messageText = `#LIFF記帳\n${JSON.stringify(data)}`;

            try {
                // 傳送訊息回聊天室
                await liff.sendMessages([{
                    type: 'text',
                    text: messageText
                }]);
                // 關閉視窗
                liff.closeWindow();
            } catch (error) {
                alert('傳送失敗: ' + error);
            }
        });
    </script>
</body>
</html>
