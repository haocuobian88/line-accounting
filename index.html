<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記帳小雞</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Gemini 風格變數 --- */
        :root {
            --primary-gradient: linear-gradient(135deg, #4285F4 0%, #9B72CB 100%);
            --surface-color: #ffffff;
            --background-color: #F0F4F9;
            --text-main: #1F1F1F;
            --text-sub: #5E5E5E;
            --border-radius: 24px;
            --input-bg: #F0F2F5;
            --accent-color: #4285F4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Roboto', 'Noto Sans TC', sans-serif;
            background-color: var(--background-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            max-height: 900px;
            padding-top: 10px;
        }

        .tabs-container { padding: 10px 24px 16px; background: var(--surface-color); position: sticky; top: 0; z-index: 10; }
        .tabs { display: flex; background: var(--input-bg); border-radius: 50px; padding: 4px; position: relative; }
        .tab { flex: 1; padding: 12px; text-align: center; font-size: 15px; font-weight: 500; color: var(--text-sub); cursor: pointer; z-index: 2; transition: color 0.3s; border: none; background: transparent; }
        .tab.active { color: var(--text-main); font-weight: 700; }
        .tab-indicator { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--surface-color); border-radius: 50px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); z-index: 1; }

        .content-scroll-area { flex: 1; overflow-y: auto; padding: 10px 24px 100px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 24px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-sub); font-weight: 600; margin-left: 12px; }
        .input-wrapper { position: relative; border-radius: 16px; background: var(--input-bg); transition: all 0.3s; }
        .input-wrapper:focus-within { background: #fff; box-shadow: 0 0 0 2px var(--accent-color); }
        .form-control { width: 100%; padding: 16px 20px; border: none; background: transparent; font-size: 16px; color: var(--text-main); font-family: inherit; border-radius: 16px; }
        .form-control:focus { outline: none; }
        
        /* 金額輸入特別樣式 */
        input[id*="amount"] { font-size: 24px; font-weight: 700; color: var(--accent-color); }
        
        /* 日期輸入文字強制置中 */
        input[type="date"] {
            text-align: center;
            text-align-last: center;
            display: block;
            margin: 0 auto;
            width: 100%;
        }

        select.form-control { appearance: none; cursor: pointer; }
        .select-arrow { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-sub); }

        .footer-actions { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 24px; background: linear-gradient(to top, #fff 80%, rgba(255,255,255,0)); }
        .submit-btn { width: 100%; padding: 18px; border: none; border-radius: 50px; background: var(--text-main); color: white; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s, box-shadow 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .submit-btn:active { transform: scale(0.98); }
        
        /* Loading 遮罩 (預設隱藏) */
        #loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); z-index: 999; display: none; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .sparkle-spinner { width: 40px; height: 40px; position: relative; animation: rotate 2s linear infinite; }
        .sparkle-spinner::before, .sparkle-spinner::after { content: "✦"; position: absolute; font-size: 30px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sparkle-spinner::before { top: 0; left: 0; animation: bounce 1s infinite; }
        .sparkle-spinner::after { bottom: 0; right: 0; animation: bounce 1s infinite 0.5s; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: scale(0.8); } 50% { transform: scale(1.2); } }
        .loading-text { margin-top: 15px; font-weight: 500; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @media (max-width: 480px) { body { padding: 0; background: var(--surface-color); } .app-container { border-radius: 0; height: 100vh; max-height: none; box-shadow: none; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="loading-overlay">
            <div class="sparkle-spinner"></div>
            <div class="loading-text" id="loading-msg">資料傳送中...</div>
        </div>

        <div class="tabs-container">
            <div class="tabs">
                <div class="tab-indicator" id="tab-indicator"></div>
                <button class="tab active" onclick="switchTab('expense')">支出</button>
                <button class="tab" onclick="switchTab('income')">收入</button>
            </div>
        </div>

        <div class="content-scroll-area">
            <div id="expense-content" class="tab-content active">
                <div class="form-group">
                    <label>日期</label>
                    <div class="input-wrapper">
                        <input type="date" id="expense-date" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>金額</label>
                    <div class="input-wrapper">
                        <input type="number" id="expense-amount" class="form-control" inputmode="numeric" placeholder="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>消費分類</label>
                    <div class="input-wrapper">
                        <select id="expense-category" class="form-control" onchange="updateSubCategory()">
                            <option value="" disabled selected>請選擇分類</option>
                        </select>
                        <div class="select-arrow">▼</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>消費內容 (細項)</label>
                    <div class="input-wrapper">
                        <select id="expense-content-select" class="form-control">
                            <option value="" disabled selected>請先選擇分類</option>
                        </select>
                        <div class="select-arrow">▼</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>備註 (選填)</label>
                    <div class="input-wrapper">
                        <input type="text" id="expense-note" class="form-control" placeholder="例如：排骨飯加蛋">
                    </div>
                </div>

                <div class="form-group">
                    <label>支付方式</label>
                    <div class="input-wrapper">
                        <select id="expense-payment" class="form-control">
                            <option value="" disabled selected>請選擇</option>
                        </select>
                        <div class="select-arrow">▼</div>
                    </div>
                </div>
            </div>

            <div id="income-content" class="tab-content">
                <div class="form-group">
                    <label>日期</label>
                    <div class="input-wrapper">
                        <input type="date" id="income-date" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>金額</label>
                    <div class="input-wrapper">
                        <input type="number" id="income-amount" class="form-control" inputmode="numeric" placeholder="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>收入分類</label>
                    <div class="input-wrapper">
                        <select id="income-category" class="form-control">
                             <option value="" disabled selected>請選擇</option>
                        </select>
                        <div class="select-arrow">▼</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>收入備註 (選填)</label>
                    <div class="input-wrapper">
                        <input type="text" id="income-note" class="form-control" placeholder="例如：1月份薪資">
                    </div>
                </div>

                <div class="form-group">
                    <label>銀行帳戶</label>
                    <div class="input-wrapper">
                        <select id="income-bank" class="form-control">
                             <option value="" disabled selected>請選擇</option>
                        </select>
                        <div class="select-arrow">▼</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="submit-btn" onclick="submitData()">
                <span>✨ 傳送記帳</span>
            </button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔴 設定區：API 和 LIFF ID
        // ==========================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzrjTZVpFgthUGWGKaUtZvw7VW6bKhC4zVJ20XjT9NsnS_X-9qpJxOq2Sm7NMrnCVne/exec"; 
        const LIFF_ID = "2008642471-B6stNtQK"; 
        
        // ==========================================
        // ⚡️ 極速版關鍵：直接把選單寫在這裡
        // (您可以直接在這裡修改選項，不用動 Google Sheet)
        // ==========================================
        const MENU_DATA = {
            // --- 支出分類與細項 ---
            "飲食": ["早餐", "午餐", "晚餐", "飲料", "零食", "水果", "超市採買", "聚餐"],
            "交通": ["捷運", "公車", "計程車", "火車/高鐵", "加油", "停車費", "過路費", "車輛保養"],
            "娛樂": ["電影", "遊戲", "訂閱會員", "旅遊", "展覽", "KTV"],
            "購物": ["服飾", "鞋包", "日用品", "3C產品", "美妝保養", "家具家電", "雜貨"],
            "居家": ["房租", "水費", "電費", "瓦斯費", "網路費", "手機費", "管理費", "修繕"],
            "醫療": ["掛號費", "藥品", "保健食品", "醫療器材", "看診"],
            "教育": ["書籍", "課程", "文具", "學費"],
            "其他": ["捐款", "紅包", "雜支", "稅金"],
            "快速記事": [], // 特殊用途

            // --- 獨立清單 ---
            "收入分類": ["薪資收入", "獎金", "投資理財", "兼職收入", "零用錢", "其他收入"],
            "支付方式": ["現金", "信用卡", "LinePay", "悠遊卡", "銀行轉帳", "街口支付"],
            "銀行帳戶": ["中國信託", "國泰世華", "玉山銀行", "台新銀行", "中華郵政", "現金帳戶"]
        };

        const SIMPLE_MAPPING = {
            "收入分類": "income-category",
            "支付方式": "expense-payment",
            "銀行帳戶": "income-bank"
        };

        let currentUser = { userId: "unknown", displayName: "WebUser" };
        let currentTab = 'expense';

        // 初始化日期為今天
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('expense-date').value = todayStr;
        document.getElementById('income-date').value = todayStr;

        // 初始化 LIFF
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    currentUser.userId = profile.userId;
                    currentUser.displayName = profile.displayName;
                });
            } else {
                liff.login();
            }
        }).catch(console.error);

        // ✅ 直接載入選單 (不用等 API)
        function initMenus() {
            // 1. 載入主分類
            const categorySelect = document.getElementById('expense-category');
            categorySelect.innerHTML = '<option value="" disabled selected>請選擇分類</option>';
            
            // 定義要排除的系統鍵值 (如果有)
            const excludeKeys = ["收入分類", "支付方式", "銀行帳戶"];

            Object.keys(MENU_DATA).forEach(key => {
                if (!excludeKeys.includes(key)) {
                    addOption('expense-category', key, key);
                }
            });

            // 2. 載入其他簡單下拉選單
            for (const [dataKey, htmlId] of Object.entries(SIMPLE_MAPPING)) {
                const selectEl = document.getElementById(htmlId);
                if (selectEl && MENU_DATA[dataKey]) {
                    selectEl.innerHTML = '<option value="" disabled selected>請選擇</option>';
                    MENU_DATA[dataKey].forEach(item => {
                        addOption(htmlId, item, item);
                    });
                }
            }
        }

        // 當主分類改變時，更新子選單
        function updateSubCategory() {
            const mainCategory = document.getElementById('expense-category').value;
            const subSelect = document.getElementById('expense-content-select');
            subSelect.innerHTML = '<option value="" disabled selected>請選擇內容</option>';

            if (mainCategory && MENU_DATA[mainCategory]) {
                const items = MENU_DATA[mainCategory];
                if (items.length > 0) {
                    items.forEach(item => addOption('expense-content-select', item, item));
                } else {
                    // 如果沒有細項，直接顯示主分類名稱
                    addOption('expense-content-select', mainCategory, `${mainCategory} (無細項)`);
                }
            }
        }

        function addOption(selectId, value, text) {
            const select = document.getElementById(selectId);
            const option = document.createElement('option');
            option.value = value;
            option.textContent = text;
            select.appendChild(option);
        }

        // 🚀 頁面一打開就執行初始化
        initMenus();

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(div => div.classList.remove('active'));
            
            const indicator = document.getElementById('tab-indicator');
            if (tabName === 'expense') {
                indicator.style.transform = 'translateX(0%)';
                document.querySelector('.tab:nth-child(2)').classList.add('active');
            } else {
                indicator.style.transform = 'translateX(100%)';
                document.querySelector('.tab:nth-child(3)').classList.add('active');
            }
            document.getElementById(`${tabName}-content`).classList.add('active');
        }

        function submitData() {
            let data = {};
            
            if (currentTab === 'expense') {
                const amount = document.getElementById('expense-amount').value;
                const category = document.getElementById('expense-category').value;
                const contentSelect = document.getElementById('expense-content-select').value;
                const note = document.getElementById('expense-note').value;
                const payment = document.getElementById('expense-payment').value;
                
                if (!amount || amount <= 0) return alert("請輸入金額！");
                if (!category) return alert("請選擇消費分類！");
                if (!contentSelect) return alert("請選擇消費內容！");
                if (!payment) return alert("請選擇支付方式！");

                data = {
                    action: "addRecord",
                    type: "支出",
                    date: document.getElementById('expense-date').value,
                    amount: amount,
                    category: category,
                    content: contentSelect,
                    note: note,
                    payment: payment,
                    cardInfo: "", 
                    userId: currentUser.userId
                };
            } else {
                const amount = document.getElementById('income-amount').value;
                const cat = document.getElementById('income-category').value;
                const note = document.getElementById('income-note').value;
                const bank = document.getElementById('income-bank').value;
                
                if (!amount || amount <= 0) return alert("請輸入金額！");
                if (!cat) return alert("請選擇收入分類！");
                if (!bank) return alert("請選擇轉入銀行！");

                data = {
                    action: "addRecord",
                    type: "收入",
                    date: document.getElementById('income-date').value,
                    amount: amount,
                    category: cat,
                    content: cat,
                    note: note,
                    payment: "存款", 
                    cardInfo: bank,
                    userId: currentUser.userId
                };
            }

            sendDataToGAS(data);
        }

        function sendDataToGAS(data) {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-msg').innerText = "資料傳送中...";
            overlay.style.display = 'flex'; // 顯示遮罩

            fetch(GAS_API_URL, {
                method: "POST",
                body: JSON.stringify(data),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(response => {
                overlay.style.display = 'none';
                alert("✅ 記帳成功！");
                
                // 清空欄位
                document.getElementById('expense-amount').value = '';
                document.getElementById('expense-note').value = '';
                document.getElementById('expense-category').value = "";
                document.getElementById('expense-content-select').innerHTML = '<option value="" disabled selected>請先選擇分類</option>';

                document.getElementById('income-amount').value = '';
                document.getElementById('income-note').value = '';
                
                if (liff.isInClient()) liff.closeWindow();
            })
            .catch(error => {
                overlay.style.display = 'none';
                alert("❌ 發送失敗：" + error);
            });
        }
    </script>
</body>
</html>
