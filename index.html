<div class="form-group">
  <label>收支類型：</label>
  <div class="radio-group">
    <label><input type="radio" name="type" value="支出" checked> 支出</label>
    <label><input type="radio" name="type" value="收入"> 收入</label>
  </div>
</div>

<div class="form-group">
  <label for="date">日期：</label>
  <input type="date" id="date" class="form-control">
</div>

<div class="form-group">
  <label for="amount">金額：</label>
  <input type="number" id="amount" inputmode="numeric" placeholder="輸入金額">
</div>

<div class="form-group">
  <label for="category">分類：</label>
  <select id="category" class="form-control">
    <option value="餐飲">🍔 餐飲食品</option>
    <option value="交通">🚗 交通通勤</option>
    <option value="購物">🛍️ 日常購物</option>
    <option value="娛樂">🎬 休閒娛樂</option>
    <option value="居家">🏠 居家生活</option>
    <option value="薪資">💰 薪資收入</option>
    <option value="其他">📝 其他</option>
  </select>
</div>

<div class="form-group">
  <label for="content">內容備註：</label>
  <input type="text" id="content" placeholder="例如：牛肉麵">
</div>

<div class="form-group">
  <label for="payment">支付方式：</label>
  <select id="payment" class="form-control">
    <option value="現金">💵 現金</option>
    <option value="信用卡">💳 信用卡</option>
    <option value="轉帳">🏦 銀行轉帳</option>
    <option value="電子支付">📱 LinePay/街口</option>
  </select>
</div>

<button id="submitBtn">送出記帳</button>

<script>
// 1. 初始化 LIFF
liff.init({ liffId: "2008642471-B6stNtQK" }).then(() => {
    // 設定日期欄位預設為今天
    document.getElementById('date').valueAsDate = new Date();
});

// 2. 按下按鈕時的動作
document.getElementById('submitBtn').addEventListener('click', function() {
    
    // 抓取欄位資料
    const type = document.querySelector('input[name="type"]:checked').value;
    const date = document.getElementById('date').value; // 格式會是 yyyy-mm-dd
    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;
    const content = document.getElementById('content').value;
    const payment = document.getElementById('payment').value;

    // 簡單防呆
    if (!amount || !content) {
        alert("金額和內容記得填寫喔！");
        return;
    }

    // 3. 組合成 JSON 物件 (這就是要傳給 GAS 的資料)
    const data = {
        type: type,
        date: date, // 這裡傳 yyyy-mm-dd，您的 parseDate 函式可以處理
        amount: amount,
        category: category,
        content: content,
        payment: payment,
        // cardInfo: "之後可以加", 
        // note: "LIFF輸入"
    };

    // 4. 發送訊息給機器人
    // 格式必須是：
    // 第一行: #LIFF記帳
    // 第二行: JSON 字串
    const msg = "#LIFF記帳\n" + JSON.stringify(data);

    liff.sendMessages([{
        type: 'text',
        text: msg
    }]).then(() => {
        liff.closeWindow(); // 發送成功後關閉視窗
    }).catch((err) => {
        alert('發送失敗: ' + err);
    });
});
    </script>
